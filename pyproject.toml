[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elo-backend"
version = "0.0.0"
description = "Exile Loot Observer backend jobs"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "psycopg[binary]",
    "SQLAlchemy>=2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend"]
